<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ showAperture }}" hint-placeholder-val="{{ true }}">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 96 96" fill="none" style="display:block">
    <rect x="18" y="18" width="60" height="60" stroke="{{ ink }}" stroke-width="{{ swv }}"></rect>
    <rect x="18" y="18" width="60" height="60" stroke="{{ ink }}" stroke-width="{{ swv }}" transform="rotate(30 48 48)"></rect>
    <rect x="18" y="18" width="60" height="60" stroke="{{ ink }}" stroke-width="{{ swv }}" transform="rotate(60 48 48)"></rect>
    <circle cx="48" cy="48" r="{{ dotR }}" fill="{{ ink }}"></circle>
  </svg>
</sc-if>
<sc-if value="{{ showSimple }}" hint-placeholder-val="{{ false }}">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 96 96" fill="none" style="display:block">
    <rect x="19" y="19" width="58" height="58" stroke="{{ ink }}" stroke-width="{{ swv }}"></rect>
    <rect x="19" y="19" width="58" height="58" stroke="{{ ink }}" stroke-width="{{ swv }}" transform="rotate(45 48 48)"></rect>
    <circle cx="48" cy="48" r="{{ dotSimple }}" fill="{{ ink }}"></circle>
  </svg>
</sc-if>
<sc-if value="{{ showOutlier }}" hint-placeholder-val="{{ false }}">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 96 96" fill="none" style="display:block">
    <rect x="13.5" y="13.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="41.5" y="13.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="69.5" y="13.5" width="13" height="13" rx="3" fill="{{ ink }}" transform="rotate(45 76 20)"></rect>
    <rect x="13.5" y="41.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="41.5" y="41.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="69.5" y="41.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="13.5" y="69.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="41.5" y="69.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
    <rect x="69.5" y="69.5" width="13" height="13" rx="3" fill="{{ ink }}"></rect>
  </svg>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 140, &quot;height&quot;: 140},
  &quot;variant&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;aperture&quot;, &quot;options&quot;: [&quot;aperture&quot;, &quot;outlier&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Mark&quot;},
  &quot;size&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 96, &quot;min&quot;: 12, &quot;max&quot;: 512, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Mark&quot;},
  &quot;ink&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FAFAF8&quot;, &quot;options&quot;: [&quot;#FAFAF8&quot;, &quot;#0A0A0C&quot;, &quot;#6E6E78&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Mark&quot;},
  &quot;sw&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1.5, &quot;min&quot;: 0.75, &quot;max&quot;: 2.5, &quot;step&quot;: 0.125, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Mark&quot;},
  &quot;dot&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3.5, &quot;min&quot;: 2, &quot;max&quot;: 6.5, &quot;step&quot;: 0.25, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Mark&quot;},
  &quot;simplified&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Mark&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 96);
    const sw = Number(this.props.sw ?? 1.5);
    const dotR = Number(this.props.dot ?? 3.5);
    const variant = this.props.variant ?? 'aperture';
    const simplified = this.props.simplified === true || String(this.props.simplified) === 'true';
    // stroke-width in viewBox units so the rendered stroke is always `sw` px on screen
    const swv = +(sw * 96 / size).toFixed(3);
    return {
      size,
      swv,
      dotR,
      dotSimple: Math.max(dotR + 3, 6.5),
      ink: this.props.ink ?? '#FAFAF8',
      showAperture: variant === 'aperture' && !simplified,
      showSimple: variant === 'aperture' && simplified,
      showOutlier: variant === 'outlier',
    };
  }
}
</script>
</body>
</html>
