name: Deploy agent-service to Azure Container Apps

# Frontend deploys via Vercel (auto on git push) — NOT here.
# This workflow only ships the Python agent-service to Azure, and only when
# agent-service/ changes (or on manual dispatch). Requires the
# AZURE_CREDENTIALS secret (service principal — not yet created; until then
# run manually or deploy with `az containerapp up` locally).
# Env vars / secrets are configured ONCE on the Container App and persist
# across deploys, so they are intentionally NOT in this file.
on:
  push:
    branches: [main]
    paths: ["agent-service/**"]
  workflow_dispatch:

env:
  RESOURCE_GROUP: om-agent-rg
  CONTAINER_ENV: om-agent-env
  ACR_NAME: cafadfc20712acr

jobs:
  agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build + deploy agent-service
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/agent-service
          dockerfilePath: Dockerfile
          acrName: ${{ env.ACR_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_ENV }}
          containerAppName: om-agent-service
          targetPort: 8000
          ingress: external
